<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта изображений</title>
    <script>
        function changeImage() {
            let img = document.getElementById("mainImage");
            if (img.src.indexOf("image.jpg") !== -1) {
                img.src = "images/image2.jpg";
            } else {
                img.src = "images/image.jpg";
            }
        }
    </script>
</head>
<body>
<h1>Главная страница</h1>
<p>Нажмите на области изображения для выполнения различных действий:</p>
<img id="mainImage" src="images/image.jpg" usemap="#imagemap" alt="Пример карты изображений">

<map name="imagemap">
    <area shape="rect" coords="50,50,150,150" href="page1.html" alt="Прямоугольник">
    <area shape="circle" coords="300,100,50" href="https://vkvideo.ru/" alt="Круг">
    <area shape="poly" coords="200,200,250,250,220,300,180,280" href="https://javarush.com/" alt="Многоугольник">
    <area shape="rect" coords="50,200,150,300" href="javascript:void(0);" alt="Смена картинки" onclick="changeImage();">
    <area shape="poly" coords="612,300,450,220,340,280,290,260" href="page2.html" alt="Многоугольник" target="_blank">
</map>
</body>
</html>
